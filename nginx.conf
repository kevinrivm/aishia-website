server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Enable efficient file serving
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    # Never gzip video — it's already compressed and gzip blocks range requests
    gzip_types ~* "video/";

    # MP4 video — byte-range support is critical for smooth looping
    location ~* \.mp4$ {
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Content-Type "video/mp4" always;
        mp4;
        mp4_buffer_size     1m;
        mp4_max_buffer_size 5m;
    }

    # Live del 19-nov: /live sirve la landing (live/). Cuando pase, regresar aquí el
    # «return 302 /comunidad;» que tenía después del 30-sep.

    # Botón «Entrar al live» de los recordatorios de WhatsApp: /envivo/<código>.
    # n8n anota el clic (cuenta como asistencia de esa persona) y redirige al live de
    # YouTube; el enlace del live se edita en n8n, no aquí. Sin código también funciona.
    location ~ ^/envivo/?([A-Za-z0-9_-]*)$ {
        return 302 "https://n8n2.kevinbelier.cloud/webhook/live19-entrar?c=$1";
    }

    # CSS y JS: se revalidan siempre (si no, un cambio tarda 30 días en verse)
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache" always;
    }

    # Imágenes, iconos y fuentes: sí se cachean
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Enlaces cortos de las descripciones de YouTube. Son 302 a propósito: si cambia
    # el destino (comunidad cerrada, otro número, otro plan) se edita aquí y no en
    # cada video.
    location ~ ^/comunidad/?$ {
        return 302 "https://www.skool.com/vibe-community-vip";
    }
    location ~ ^/dudas/?$ {
        return 302 "https://wa.me/5215654940354?text=Hola%20Kevin%2C%20tengo%20dudas%20sobre%20la%20comunidad";
    }
    location ~ ^/vps/?$ {
        return 302 "https://www.hostinger.mx/cart?product=vps%3Avps_kvm_2&period=12&referral_type=cart_link&REFERRALCODE=OJWKEVINRB75&referral_id=0199c0ef-a36b-706a-875a-9dca9a3a137e";
    }
    location ~ ^/grupo/?$ {
        return 302 "https://chat.whatsapp.com/Ik7iOhgsWVpKRHj1EIZhiF";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
