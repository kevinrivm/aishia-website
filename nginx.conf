server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Enable efficient file serving
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    # Never gzip video — it's already compressed and gzip blocks range requests
    gzip_types ~* "video/";

    # MP4 video — byte-range support is critical for smooth looping
    location ~* \.mp4$ {
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Content-Type "video/mp4" always;
        mp4;
        mp4_buffer_size     1m;
        mp4_max_buffer_size 5m;
    }

    # Config de la landing: sin caché para que los cambios se vean al instante
    location = /live/config.js {
        add_header Cache-Control "no-cache" always;
    }

    # CSS y JS: se revalidan siempre (si no, un cambio tarda 30 días en verse)
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache" always;
    }

    # Imágenes, iconos y fuentes: sí se cachean
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Enlaces cortos de las descripciones de YouTube. Son 302 a propósito: si cambia
    # el destino (comunidad cerrada, otro número, otro plan) se edita aquí y no en
    # cada video.
    location ~ ^/comunidad/?$ {
        return 302 "https://www.skool.com/vibe-community-vip";
    }
    location ~ ^/dudas/?$ {
        return 302 "https://wa.me/5214623975400?text=Hola%20Kevin%2C%20tengo%20dudas%20sobre%20la%20comunidad";
    }
    location ~ ^/vps/?$ {
        return 302 "https://www.hostinger.mx/cart?product=vps%3Avps_kvm_2&period=12&referral_type=cart_link&REFERRALCODE=OJWKEVINRB75&referral_id=0199c0ef-a36b-706a-875a-9dca9a3a137e";
    }
    location ~ ^/grupo/?$ {
        return 302 "https://chat.whatsapp.com/FqwBO8zjxcdHi4kyoljyJJ";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
